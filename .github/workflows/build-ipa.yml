name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build (unsigned)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          EXTRA=()
          if [ -n "$SUPABASE_URL" ]; then
            # xcconfig-style escape so the // survives Info.plist substitution
            EXTRA+=("SUPABASE_URL=${SUPABASE_URL/\/\//:/\$()/}")
            EXTRA+=("SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY")
          fi
          set -o pipefail
          xcodebuild -project THERMOAI.xcodeproj -scheme THERMOAI \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            "${EXTRA[@]}" build 2>&1 | tee build.log | tail -n 300
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/THERMOAI.app Payload/
          zip -qr THERMOAI.ipa Payload
          ls -lh THERMOAI.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: THERMOAI-ipa
          path: THERMOAI.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
